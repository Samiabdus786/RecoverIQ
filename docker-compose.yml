services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recoveriq
      POSTGRES_USER: recoveriq
      POSTGRES_PASSWORD: recoveriq_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveriq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recoveriq_pg:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://recoveriq:recoveriq_demo@postgres:5432/recoveriq
      PAYMENT_PROVIDER: mock
      DEMO_MODE: "true"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: .
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  recoveriq_pg:
