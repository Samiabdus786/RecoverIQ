services:
  - type: web
    name: recoveriq-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: true
